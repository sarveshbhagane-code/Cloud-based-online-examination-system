<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloud-Based Online Examination System - Secure, scalable platform for conducting online assessments with real-time monitoring and auto-grading.">
  <title>CloudExam - Online Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <div id="app">

    <div id="loading-screen" class="loading-screen">

  <div id="toast-container" class="toast-container"></div>

  <script src="core.js"></script>
  <script src="views.js"></script>
